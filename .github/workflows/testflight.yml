# Compila l'app iPhone su un Mac di GitHub e la carica su TestFlight.
# Parte da sola a ogni modifica della cartella ios/ su main, oppure a mano da Actions > TestFlight > Run workflow.
# Unico segreto richiesto (Settings > Secrets and variables > Actions):
#   ASC_KEY_P8      contenuto completo del file AuthKey_73BG4J4Z59.p8
# Team ID, Key ID e Issuer ID non sono segreti e stanno qui sotto.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/testflight.yml"]

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: MHVP7648XJ
      ASC_KEY_ID: 73BG4J4Z59
      ASC_ISSUER_ID: 0b8ed527-0cbc-471a-b727-4a631ec4eea0
      ARCHIVIO: ${{ runner.temp }}/MagazzinoElettrico.xcarchive
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la chiave
        id: chiave
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Manca il segreto ASC_KEY_P8: build per TestFlight saltata"; fi

      - name: Prepara la chiave API
        if: steps.chiave.outputs.ok == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "CHIAVE=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          sed -i '' "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist

      - name: Compila (Archive)
        if: steps.chiave.outputs.ok == 'true'
        run: |
          xcodebuild archive \
            -project ios/MagazzinoElettrico.xcodeproj \
            -scheme MagazzinoElettrico \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVIO" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CHIAVE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Carica su TestFlight
        if: steps.chiave.outputs.ok == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVIO" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CHIAVE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Cancella la chiave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
