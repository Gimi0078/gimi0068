# Compila l'app iPhone su un Mac di GitHub e la carica su TestFlight.
# Parte da sola a ogni modifica della cartella ios/ su main, oppure a mano da Actions > TestFlight > Run workflow.
# Segreti richiesti (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID   Team ID dell'account Apple Developer (10 caratteri)
#   ASC_KEY_ID      Key ID della chiave API di App Store Connect
#   ASC_ISSUER_ID   Issuer ID della stessa pagina
#   ASC_KEY_P8      contenuto completo del file AuthKey_XXXX.p8
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/testflight.yml"]

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ARCHIVIO: ${{ runner.temp }}/MagazzinoElettrico.xcarchive
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i segreti
        run: |
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!s}" ] || { echo "::error::Manca il segreto $s"; exit 1; }
          done

      - name: Prepara la chiave API
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Manca il segreto ASC_KEY_P8"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "CHIAVE=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          sed -i '' "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist

      - name: Compila (Archive)
        run: |
          xcodebuild archive \
            -project ios/MagazzinoElettrico.xcodeproj \
            -scheme MagazzinoElettrico \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVIO" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CHIAVE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Carica su TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVIO" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CHIAVE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Cancella la chiave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
