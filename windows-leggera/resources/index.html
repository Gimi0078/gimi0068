<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magazzino Elettrico</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<script src="js/neutralino.js"></script>
<script src="js/bridge.js"></script>
</head>
<body>
<main class="login" id="accesso">
  <form class="panel" id="f" autocomplete="off">
    <div class="brand">Magazzino Elettrico<small>Versione beta · Accesso</small></div>
    <div><label for="u">Account</label>
      <select id="u" style="width:100%"><option value="magazziniere">Magazziniere</option><option value="sviluppatore">Sviluppatore</option></select></div>
    <div><label for="p">Password</label><input id="p" type="password" required autofocus></div>
    <div id="nuova" hidden style="display:grid;gap:12px">
      <p class="sub">Primo accesso: scegli una nuova password di almeno 8 caratteri.</p>
      <div><label for="n1">Nuova password</label><input id="n1" type="password" minlength="8"></div>
      <div><label for="n2">Ripeti la nuova password</label><input id="n2" type="password" minlength="8"></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" type="submit" id="go">Entra</button>
  </form>
</main>
<div id="app" hidden>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Magazzino Elettrico<small>Versione beta</small></div>
      <div class="who"><span class="chip info" id="chi"></span><button class="btn" id="backupBtn" type="button">Backup</button><button class="btn" id="esciBtn" type="button">Esci</button><button class="btn primary" id="scanBtn" type="button">Scansiona QR</button></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<div class="wrap"><main id="view"></main></div>
<div class="toast" id="toast" hidden></div>
</div>

<script type="module">
// Parte dopo l'accesso (vedi js/bridge.js)
await window.magazzino.pronto;
const CAT = {cavi:"Cavi",tubi:"Tubi e canaline",scat:"Scatole e cassette",frut:"Frutti e placche",quad:"Quadri e centralini",prot:"Protezioni",mors:"Morsetteria",illu:"Illuminazione",cito:"Citofonia e videocitofonia",dati:"Dati e TV",domo:"Domotica",allr:"Antifurto",fiss:"Fissaggi e minuteria"};
const grossOf = m => ["BTicino","ABB","Hager","Prysmian","Wago","Ksenia","Comelit","Philips","Finder"].includes(m) ? "Comet" : "Sonepar";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const art = [
  ["CV15","cavi","Prysmian","Cavo FS17 1x1,5 mm² blu","m",180,200],
  ["CV15M","cavi","Prysmian","Cavo FS17 1x1,5 mm² marrone","m",260,200],
  ["CV25","cavi","General Cavi","Cavo FS17 1x2,5 mm² marrone","m",420,200],
  ["CV25G","cavi","General Cavi","Cavo FS17 1x2,5 mm² giallo-verde","m",310,200],
  ["CV6","cavi","Prysmian","Cavo FS17 1x6 mm² nero","m",40,50],
  ["FG3G25","cavi","Prysmian","Cavo FG16OR16 3G2,5","m",95,50],
  ["UTP6","cavi","Nexans","Cavo UTP Cat.6","m",150,100],
  ["COAX","cavi","Fracarro","Cavo coassiale 5 mm classe A+","m",120,100],
  ["COR20","tubi","Dielectrix","Corrugato Ø20 grigio","m",75,100],
  ["COR25","tubi","Dielectrix","Corrugato Ø25 grigio","m",140,100],
  ["RIG20","tubi","Gewiss","Tubo rigido Ø20","m",36,30],
  ["CAN40","tubi","Bocchiotti","Canalina 40x17 bianca","m",18,20],
  ["S503","scat","BTicino","Scatola da incasso 503","pz",64,30],
  ["S503V","scat","Vimar","Scatola da incasso 3 moduli","pz",40,30],
  ["S504","scat","Gewiss","Scatola da incasso 504","pz",22,15],
  ["DER","scat","Gewiss","Cassetta di derivazione 100x100","pz",12,15],
  ["DER150","scat","BTicino","Cassetta di derivazione 152x98","pz",8,10],
  ["QD12","quad","Gewiss","Centralino 12 moduli da incasso","pz",2,3],
  ["QD24","quad","BTicino","Centralino 24 moduli da incasso","pz",3,2],
  ["QE8","quad","Hager","Centralino 8 moduli da parete IP65","pz",4,2],
  ["MT16","prot","ABB","Magnetotermico 1P+N C16 4,5kA","pz",14,8],
  ["MT10","prot","ABB","Magnetotermico 1P+N C10 4,5kA","pz",9,6],
  ["MT16S","prot","Schneider Electric","Magnetotermico 1P+N C16 4,5kA","pz",5,4],
  ["MT16H","prot","Hager","Magnetotermico 1P+N C16 4,5kA","pz",2,4],
  ["MT16B","prot","BTicino","Magnetotermico 1P+N C16 4,5kA","pz",6,4],
  ["DIF25","prot","ABB","Differenziale 2P 25A 30mA tipo A","pz",3,4],
  ["DIF40H","prot","Hager","Differenziale 2P 40A 30mA tipo A","pz",2,2],
  ["MTD16","prot","Schneider Electric","Magnetotermico differenziale 1P+N C16 30mA","pz",4,3],
  ["SPD","prot","Finder","Scaricatore di sovratensione 1P+N","pz",1,2],
  ["WAGO","mors","Wago","Morsetto 221-413 (3 poli)","pz",150,100],
  ["WAGO2","mors","Wago","Morsetto 221-412 (2 poli)","pz",90,100],
  ["WAGO5","mors","Wago","Morsetto 221-415 (5 poli)","pz",60,50],
  ["MORS","mors","Gewiss","Morsettiera di derivazione 4 poli","pz",10,5],
  ["LED9P","illu","Philips","Lampada LED E27 9W 2700K","pz",24,10],
  ["LED9L","illu","Ledvance","Lampada LED E27 9W 4000K","pz",12,10],
  ["PLAF","illu","Disano","Plafoniera LED IP65 18W","pz",3,2],
  ["EMER","illu","Beghelli","Lampada di emergenza LED 1h","pz",5,4],
  ["PECO","cito","Comelit","Pulsantiera esterna 2 fili 1 utente","pz",1,1],
  ["PEBT","cito","BTicino","Posto esterno 2 fili 1 pulsante","pz",2,1],
  ["MONBT","cito","BTicino","Videocitofono vivavoce 7\"","pz",1,1],
  ["MONUR","cito","Urmet","Videocitofono vivavoce 4,3\"","pz",0,1],
  ["ALCI","cito","Comelit","Alimentatore sistema 2 fili","pz",1,1],
  ["PART2","dati","Fracarro","Partitore TV 2 uscite","pz",6,4],
  ["CONF","dati","Fracarro","Connettore F a compressione","pz",40,30],
  ["RJ45P","dati","Legrand","Plug RJ45 Cat.6","pz",30,20],
  ["SH1PM","domo","Shelly","Relè Wi-Fi 1PM","pz",4,3],
  ["MHATT","domo","BTicino","Attuatore MyHome","pz",1,2],
  ["BYME","domo","Vimar","Attuatore By-me","pz",0,0],
  ["KSCEN","allr","Ksenia","Centrale antifurto lares 4.0","pz",1,0],
  ["KSPIR","allr","Ksenia","Sensore volumetrico da interno","pz",3,2],
  ["TAS6","fiss","Fischer","Tassello SX 6 (conf. 100)","conf",4,3],
  ["FASC","fiss","HellermannTyton","Fascette 200 mm (conf. 100)","conf",2,3],
  ["NAST","fiss","3M","Nastro isolante nero","pz",14,10]
].map(([id,cat,marca,nome,um,qta,min]) => ({id,cat,marca,nome,um,qta,min,gross:grossOf(marca)}));

// Frutti e placche: marca → serie, ogni serie ha le stesse funzioni in più colori
const serieFrutti = {
  "BTicino":["Living Now","Living Light","Axolute","Matix","Matix GO"],
  "Vimar":["Plana","Arké","Eikon","Eikon Evo","Linea"],
  "Gewiss":["Chorus","System"],
  "ABB":["Chiara","Mylos","Zenit"],
  "Legrand":["Vela","Arteor"],
  "Schneider Electric":["Unica"],
  "AVE":["Sistema 45","Allumia"]
};
const marcaCod = {"BTicino":"BT","Vimar":"VI","Gewiss":"GW","ABB":"AB","Legrand":"LE","Schneider Electric":"SE","AVE":"AV"};
const funzioni = [
  ["INT","Interruttore 1P 16A"],["DEV","Deviatore 1P 16A"],["INV","Invertitore 1P 16A"],["PUL","Pulsante 1P NO 10A"],
  ["PRB","Presa bipasso 10/16A"],["PRS","Presa Schuko universale"],["RJ45","Presa dati RJ45 Cat.6"],["TV","Presa TV coassiale"],
  ["DIM","Dimmer universale"],["CPF","Copriforo"],["SUP3","Supporto 3 moduli",true],["PL3","Placca 3 moduli"],["PL4","Placca 4 moduli"]
];
const colori = [["BI","Bianco"],["AN","Antracite"]];
const aScorta = ["BTicino|Living Now","BTicino|Matix","Vimar|Plana","ABB|Chiara"];
const comuni = ["INT","DEV","PRB","PRS","SUP3","PL3"];
const serieCod = s => s.includes(" ") ? s.split(" ").map(w => w[0]).join("").toUpperCase() : s.slice(0,2).toUpperCase();
const hash = s => [...s].reduce((h,c) => (h*31 + c.charCodeAt(0)) % 9973, 7);
function aggiungiSerie(marca, serie, stock){
  const mc = marcaCod[marca] || marca.slice(0,2).toUpperCase(), sc = serieCod(serie);
  funzioni.forEach(([fn,nome,nocol]) => (nocol ? [[null,null]] : colori).forEach(([cc,col]) => {
    const id = [mc,sc,fn,cc].filter(Boolean).join(".");
    let qta = 0, min = 0;
    if(stock){ const h = hash(id); min = comuni.includes(fn) ? (cc === "AN" ? 4 : 10) : 2; qta = cc === "AN" ? h % 8 : h % 35; }
    art.push({id,cat:"frut",marca,serie,colore:col,fn,nome,um:"pz",qta,min,gross:grossOf(marca)});
  }));
}
Object.entries(serieFrutti).forEach(([m,ss]) => ss.forEach(s => aggiungiSerie(m, s, aScorta.includes(m+"|"+s))));

const furgoni = [
  {nome:"Furgone Marco",targa:"FX 482 KL",items:{CV25:60,CV15:40,S503:12,"BT.LN.INT.BI":8,"BT.LN.PRB.BI":2,WAGO:30,COR20:25}},
  {nome:"Furgone Luca",targa:"GB 117 TR",items:{CV25:20,CV25G:30,MT16:4,"BT.LN.PL3.BI":6,"BT.LN.DEV.BI":5,WAGO:10}}
];
const standardFurgone = {CV25:80,CV15:50,CV25G:40,S503:15,"BT.LN.INT.BI":10,"BT.LN.DEV.BI":6,"BT.LN.PRB.BI":8,"BT.LN.SUP3":10,"BT.LN.PL3.BI":8,WAGO:40,COR20:30,MT16:4};
const kits = [
  {nome:"Punto luce semplice",desc:"Un interruttore e un punto luce",items:[["CV15",12],["CV25G",6],["COR20",8],["S503",1],["fn:INT",1],["fn:SUP3",1],["fn:PL3",1],["WAGO",3]]},
  {nome:"Presa in stanza",desc:"Una presa bipasso da linea esistente",items:[["CV25",10],["CV25G",5],["COR20",6],["S503",1],["fn:PRB",1],["fn:SUP3",1],["fn:PL3",1],["WAGO2",2]]},
  {nome:"Quadro appartamento",desc:"Centralino con generale e 3 linee",items:[["QD12",1],["DIF25",1],["MT16",3],["CV25",6],["WAGO",6]]}
];
const kitSel = kits.map(() => ({serie:"BTicino|Living Now",colore:"Bianco",n:1}));
const cantieri = [
  {id:"C-2026-041",nome:"Rossi, via Garibaldi 12",tipo:"Ristrutturazione bagno e cucina",serie:"Vimar Plana bianco",mov:[["2026-10-21","CV25",30],["2026-10-21","S503",6],["2026-10-22","VI.PL.PRB.BI",4],["2026-10-22","MT16",2]]},
  {id:"C-2026-043",nome:"Condominio Le Querce",tipo:"Videocitofono e luci scale",serie:"BTicino Living Now bianco",mov:[["2026-10-24","CV15",60],["2026-10-24","WAGO",24],["2026-10-25","DER",3],["2026-10-25","PEBT",1]]},
  {id:"C-2026-045",nome:"Bianchi, via Roma 5",tipo:"Impianto nuovo appartamento",serie:"ABB Chiara antracite",mov:[]}
];

// Salvataggio: i dati stanno in un file sul PC (vedi main.js); al primo avvio si parte dai dati di esempio qui sopra
const oggi = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const store = window.magazzino;
const salvato = store?.load();
if(salvato){
  art.splice(0, art.length, ...salvato.art);
  Object.keys(serieFrutti).forEach(k => delete serieFrutti[k]); Object.assign(serieFrutti, salvato.serieFrutti);
  furgoni.splice(0, furgoni.length, ...salvato.furgoni);
  cantieri.splice(0, cantieri.length, ...salvato.cantieri);
}
function salva(){ if(store && !store.save({versione:1, art, serieFrutti, furgoni, cantieri})) toast("Attenzione: salvataggio non riuscito"); }
const by = id => art.find(a => a.id === id);
const fmt = (n,um) => n.toLocaleString("it-IT") + " " + um;
const desc = a => `${a.marca}${a.serie ? " · " + a.serie : ""}${a.colore ? " · " + a.colore.toLowerCase() : ""}`;
const full = a => `${a.nome} (${desc(a)})`;
function stato(a){
  if(!a.min && !a.qta) return ["info","Solo a catalogo"];
  if(a.qta < a.min*0.5) return ["bad","Sotto scorta"];
  if(a.qta < a.min) return ["warn","In esaurimento"];
  return ["ok","Disponibile"];
}
const daOrdinare = () => art.filter(a => a.qta < a.min);
const marche = () => [...new Set(art.map(a => a.marca))].sort((a,b) => a.localeCompare(b,"it"));
const frutto = (key,col,fn) => { const [m,s] = key.split("|"); return art.find(a => a.cat==="frut" && a.marca===m && a.serie===s && a.fn===fn && (a.colore===col || a.colore===null)); };

// Il magazziniere lavora sulle giacenze; marche e serie le gestisce lo sviluppatore
const io = store?.utente() || {ruolo:"sviluppatore", nome:"Anteprima"};
const tabs = [["catalogo","Catalogo"],["kit","Kit lavoro"],["furgoni","Furgoni"],["ordini","Da ordinare"],["cantieri","Cantieri"],...(io.ruolo === "sviluppatore" ? [["marche","Marche e serie"]] : [])];
document.getElementById("chi").textContent = io.nome;
document.getElementById("esciBtn").addEventListener("click", () => store?.logout());
document.getElementById("backupBtn").addEventListener("click", () => store.esporta().then(ok => ok && toast("Backup salvato"), () => toast("Backup non riuscito")));
let current = "catalogo", filtro = "", marcaF = "", catF = "", fMarca = "BTicino", fSerie = "Living Now";
function renderTabs(){
  const n = daOrdinare().length;
  document.getElementById("tabs").innerHTML = tabs.map(([k,l]) =>
    `<button role="tab" type="button" data-k="${k}" aria-selected="${k===current}">${l}${k==="ordini"&&n?`<span class="badge">${n}</span>`:""}</button>`).join("");
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ current = b.dataset.k; render(); }});
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); }

function tabella(list){
  const max = 100, rows = list.slice(0,max).map(a => { const [c,l] = stato(a);
    return `<tr><td>${esc(a.nome)}<div class="sub">${esc(desc(a))}</div><div class="code">${esc(a.id)}</div></td><td>${CAT[a.cat]}</td><td class="num">${fmt(a.qta,a.um)}</td><td class="num">${a.min ? fmt(a.min,a.um) : "—"}</td><td><span class="chip ${c}">${l}</span></td></tr>`; }).join("");
  return `<div class="panel scroll"><table><thead><tr><th>Articolo</th><th>Categoria</th><th class="num">In sede</th><th class="num">Minima</th><th>Stato</th></tr></thead><tbody>${rows || `<tr><td colspan="5">Nessun articolo trovato. Prova a togliere un filtro.</td></tr>`}</tbody></table></div>
    ${list.length > max ? `<p class="sub">Mostrati ${max} articoli su ${list.length}. Restringi la ricerca o scegli una marca.</p>` : ""}`;
}
function matriceFrutti(){
  const serieList = serieFrutti[fMarca] || [];
  if(!serieList.includes(fSerie)) fSerie = serieList[0];
  const key = fMarca + "|" + fSerie;
  const inSede = art.some(a => a.marca===fMarca && a.serie===fSerie && a.qta > 0);
  const righe = funzioni.map(([fn,nome,nocol]) => {
    const cell = col => { const a = frutto(key,col,fn); if(!a) return "<td>—</td>"; const [c] = stato(a);
      return `<td class="num"><span class="chip ${a.qta ? c : "info"}">${a.qta} pz</span><div class="code">${a.id}</div></td>`; };
    return `<tr><td>${nome}</td>${nocol ? cell(null).replace("<td", '<td colspan="2"') : colori.map(([,col]) => cell(col)).join("")}</tr>`;
  }).join("");
  return `<div class="panel" style="padding:16px;display:grid;gap:12px">
    <div class="row"><label for="fm">Marca</label><select id="fm">${Object.keys(serieFrutti).map(m => `<option ${m===fMarca?"selected":""}>${esc(m)}</option>`).join("")}</select>
    <label for="fs">Serie</label><select id="fs">${serieList.map(s => `<option ${s===fSerie?"selected":""}>${esc(s)}</option>`).join("")}</select>
    ${inSede ? `<span class="chip ok">Serie tenuta a scorta</span>` : `<span class="chip info">Solo a catalogo, si ordina su richiesta</span>`}</div>
    <div class="sub">Tutte le serie hanno le stesse funzioni, così kit e preventivi funzionano con qualunque marca. Cambia marca e serie per vedere cosa hai in sede.</div></div>
    <div class="panel scroll"><table><thead><tr><th>Funzione</th>${colori.map(([,c]) => `<th class="num">${c}</th>`).join("")}</tr></thead><tbody>${righe}</tbody></table></div>`;
}

const views = {
  catalogo(){
    const conta = c => art.filter(a => a.cat === c);
    const chips = `<div class="chips"><button type="button" data-cat="" aria-pressed="${!catF}">Tutte <span>${art.length}</span></button>${Object.entries(CAT).map(([k,l]) => `<button type="button" data-cat="${k}" aria-pressed="${catF===k}">${l} <span>${conta(k).length}</span></button>`).join("")}</div>`;
    let corpo;
    const q = filtro.toLowerCase();
    if(catF === "frut" && !q && !marcaF) corpo = matriceFrutti();
    else if(!catF && !q && !marcaF) corpo = `<div class="grid">${Object.entries(CAT).map(([k,l]) => { const list = conta(k), mk = new Set(list.map(a => a.marca)), sotto = list.filter(a => a.qta < a.min).length;
        return `<button type="button" class="panel card catcard" data-cat="${k}"><h3>${l}</h3><div class="meta">${list.length} articoli · ${mk.size} marche</div><div class="tags">${[...mk].slice(0,6).map(m => `<span class="chip info">${esc(m)}</span>`).join("")}${mk.size>6?`<span class="chip info">+${mk.size-6}</span>`:""}</div>${sotto?`<span class="chip warn">${sotto} da riordinare</span>`:`<span class="chip ok">Scorte a posto</span>`}</button>`; }).join("")}</div>`;
    else corpo = tabella(art.filter(a => (!catF || a.cat===catF) && (!marcaF || a.marca===marcaF) && (!q || [a.nome,a.marca,a.serie,a.colore,a.id].join(" ").toLowerCase().includes(q))));
    return `<div><h2>Catalogo</h2><p class="lead">Ogni articolo ha categoria e marca. Frutti e placche hanno anche serie e colore. Cerca per nome, marca, serie o codice.</p></div>
      <div class="row"><input id="q" type="search" placeholder="Es. deviatore plana, C16 hager, wago" value="${esc(filtro)}" style="flex:1 1 240px">
      <select id="mf"><option value="">Tutte le marche (${marche().length})</option>${marche().map(m => `<option ${m===marcaF?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
      ${chips}${corpo}`;
  },
  kit(){
    const serieOpts = sel => Object.entries(serieFrutti).map(([m,ss]) => `<optgroup label="${esc(m)}">${ss.map(s => `<option value="${esc(m+"|"+s)}" ${sel===m+"|"+s?"selected":""}>${esc(m+" "+s)}</option>`).join("")}</optgroup>`).join("");
    return `<div><h2>Kit per tipo di lavoro</h2><p class="lead">Il kit dice "un interruttore", non "un interruttore BTicino". Marca, serie e colore li scegli per ogni cantiere, secondo cosa vuole il cliente.</p></div>
      <div class="row"><label for="kc">Cantiere</label><select id="kc" style="flex:1 1 240px">${cantieri.map(c => `<option value="${c.id}">${c.id} · ${esc(c.nome)}</option>`).join("")}</select></div>
      <div class="grid">${kits.map((k,i) => { const s = kitSel[i], haFrutti = k.items.some(([r]) => r.startsWith("fn:"));
        return `<div class="panel card"><h3>${k.nome}</h3><div class="meta">${k.desc}</div>
        ${haFrutti ? `<div class="row"><select id="ks${i}" data-ks="${i}" style="flex:1 1 160px">${serieOpts(s.serie)}</select><select id="kcol${i}" data-kcol="${i}">${colori.map(([,c]) => `<option ${c===s.colore?"selected":""}>${c}</option>`).join("")}</select></div>` : ""}
        <ul>${k.items.map(([r,q]) => { const a = r.startsWith("fn:") ? frutto(s.serie,s.colore,r.slice(3)) : by(r);
          const disp = a && a.qta >= q*s.n; return `<li>${esc(a.nome)} <span class="sub">${esc(desc(a))}</span>: ${fmt(q,a.um)}${disp?"":` <span class="chip bad">manca</span>`}</li>`; }).join("")}</ul>
        <div class="row"><label for="kq${i}">Quantità</label><input id="kq${i}" data-kq="${i}" type="number" min="1" value="${s.n}" style="width:70px"><button class="btn primary" type="button" data-kit="${i}">Scarica kit</button></div></div>`; }).join("")}</div>`;
  },
  furgoni(){
    return `<div><h2>Materiale sui furgoni</h2><p class="lead">Ogni furgone ha una dotazione standard. La barra mostra quanto è carico rispetto allo standard; "Ricarica" sposta il mancante dal magazzino centrale.</p></div>
      <div class="grid">${furgoni.map((f,i) => {
        const righe = Object.entries(standardFurgone).map(([id,std]) => { const a = by(id), q = f.items[id]||0, p = Math.min(100,Math.round(q/std*100));
          return `<div><div class="row" style="justify-content:space-between"><span>${esc(a.nome)} <span class="sub">${esc(desc(a))}</span></span><span class="code">${q}/${std} ${a.um}</span></div><div class="bar ${p<40?"low":""}"><span style="width:${p}%"></span></div></div>`; }).join("");
        const manc = Object.entries(standardFurgone).filter(([id,std]) => (f.items[id]||0) < std).length;
        return `<div class="panel card"><div class="row" style="justify-content:space-between"><h3>${f.nome}</h3><span class="code">${f.targa}</span></div>
          <div>${manc?`<span class="chip warn">${manc} articoli da ricaricare</span>`:`<span class="chip ok">Completo</span>`}</div>${righe}
          <button class="btn primary" type="button" data-ric="${i}" ${manc?"":"disabled"}>Ricarica dal magazzino</button></div>`;
      }).join("")}</div>`;
  },
  ordini(){
    const lista = daOrdinare(), groups = {};
    lista.forEach(a => (groups[a.gross] ||= []).push(a));
    if(!lista.length) return `<div><h2>Da ordinare</h2><p class="lead">Tutte le scorte sono sopra la minima. Niente da ordinare.</p></div>`;
    return `<div><h2>Da ordinare</h2><p class="lead">Lista generata in automatico dagli articoli sotto scorta, divisa per grossista e ordinata per marca. La quantità proposta riporta la giacenza al doppio della minima.</p></div>
      ${Object.entries(groups).map(([g,items]) => `<div class="panel"><div class="row" style="justify-content:space-between;padding:12px 12px 0"><h2 style="font-size:20px">${g} · ${items.length} righe</h2><button class="btn" type="button" data-copy="${g}">Copia ordine</button></div>
        <div class="scroll"><table><thead><tr><th>Articolo</th><th class="num">In sede</th><th class="num">Da ordinare</th></tr></thead><tbody>
        ${items.sort((a,b) => (a.marca+a.nome).localeCompare(b.marca+b.nome,"it")).map(a => `<tr><td>${esc(a.nome)}<div class="sub">${esc(desc(a))}</div><div class="code">${a.id}</div></td><td class="num">${fmt(a.qta,a.um)}</td><td class="num"><strong>${fmt(a.min*2-a.qta,a.um)}</strong></td></tr>`).join("")}
        </tbody></table></div></div>`).join("")}`;
  },
  cantieri(){
    return `<div><h2>Materiale per cantiere</h2><p class="lead">Ogni prelievo è collegato a una commessa, con marca e serie. A fine lavoro hai l'elenco pronto per la fattura o per la dichiarazione di conformità.</p></div>
      <form class="panel" id="cantForm" style="padding:16px;display:grid;gap:10px">
        <div class="row"><input id="cn" placeholder="Cliente e indirizzo, es. Verdi, via Dante 3" required style="flex:1 1 220px">
        <input id="ct" placeholder="Tipo di lavoro" style="flex:1 1 180px">
        <input id="cs" placeholder="Serie scelta, es. BTicino Living Now bianco" style="flex:1 1 200px">
        <button class="btn primary" type="submit">Nuovo cantiere</button></div></form>
      <div class="grid">${cantieri.map(c => {
        const tot = {}; c.mov.forEach(([,id,q]) => tot[id] = (tot[id]||0)+q);
        return `<div class="panel card"><div class="code">${c.id}</div><h3>${esc(c.nome)}</h3><div class="meta">${esc(c.tipo)} · ${c.mov.length} prelievi</div><div><span class="chip info">Serie scelta: ${esc(c.serie)}</span></div>
          ${Object.keys(tot).length ? `<ul>${Object.entries(tot).map(([id,q]) => `<li>${esc(full(by(id)))}: ${fmt(q,by(id).um)}</li>`).join("")}</ul>` : `<div class="meta">Nessun materiale ancora. Scarica un kit o scansiona un articolo per iniziare.</div>`}</div>`;
      }).join("")}</div>`;
  },
  marche(){
    const list = marche().map(m => { const items = art.filter(a => a.marca===m), cats = [...new Set(items.map(a => CAT[a.cat]))];
      return `<tr><td><strong>${esc(m)}</strong></td><td><div class="tags">${cats.map(c => `<span class="chip info">${c}</span>`).join("")}</div></td><td>${esc((serieFrutti[m]||[]).join(", ") || "—")}</td><td class="num">${items.length}</td></tr>`; }).join("");
    return `<div><h2>Marche e serie</h2><p class="lead">L'elenco delle marche non è fisso: aggiungi quelle che usi. Se aggiungi una serie di frutti, l'app crea da sola tutte le funzioni (interruttore, deviatore, prese, placche…) nei vari colori.</p></div>
      <form class="panel" id="addForm" style="padding:16px;display:grid;gap:10px">
        <div class="row"><input id="nm" list="mlist" placeholder="Marca, es. Hager" required style="flex:1 1 180px"><datalist id="mlist">${marche().map(m => `<option value="${esc(m)}">`).join("")}</datalist>
        <select id="nc">${Object.entries(CAT).map(([k,l]) => `<option value="${k}" ${k==="frut"?"selected":""}>${l}</option>`).join("")}</select>
        <input id="ns" placeholder="Serie (solo frutti), es. Gallery" style="flex:1 1 180px">
        <button class="btn primary" type="submit">Aggiungi</button></div></form>
      <div class="panel scroll"><table><thead><tr><th>Marca</th><th>Categorie</th><th>Serie frutti</th><th class="num">Articoli</th></tr></thead><tbody>${list}</tbody></table></div>`;
  },
  scan(){
    const opts = Object.entries(CAT).map(([k,l]) => `<optgroup label="${l}">${art.filter(a => a.cat===k && (a.qta || a.min)).map(a => `<option value="${a.id}">${esc(full(a))}</option>`).join("")}</optgroup>`).join("");
    return `<div><h2>Scansione QR</h2><p class="lead">Sul telefono inquadri l'etichetta dello scaffale. In questa anteprima scegli l'articolo dall'elenco al posto della fotocamera.</p></div>
      <div class="panel scan"><div class="row"><div class="qr">Etichetta<br>scaffale</div>
        <div style="display:grid;gap:10px;flex:1 1 240px;min-width:0">
          <select id="sa">${opts}</select>
          <div class="row"><select id="st"><option value="scarico">Scarico</option><option value="carico">Carico</option></select>
          <input id="sq" type="number" min="1" value="1" style="width:90px">
          <select id="sc" style="flex:1 1 180px">${cantieri.map(c => `<option value="${c.id}">${c.id} · ${esc(c.nome)}</option>`).join("")}</select></div>
          <button class="btn primary" id="sgo" type="button">Registra</button></div></div></div>`;
  }
};

function render(){ renderTabs(); document.getElementById("view").innerHTML = `<div class="demo">${salvato ? "Dati salvati sul PC" : "Dati di esempio, le modifiche vengono salvate sul PC"}</div>` + views[current](); salva(); }

const view = document.getElementById("view");
document.getElementById("scanBtn").addEventListener("click", () => { current = "scan"; render(); });
view.addEventListener("input", e => {
  if(e.target.id === "q"){ filtro = e.target.value; const p = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(p,p); }
  if(e.target.dataset.kq){ kitSel[e.target.dataset.kq].n = Math.max(1, +e.target.value || 1); }
});
view.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "mf"){ marcaF = t.value; render(); }
  if(t.id === "fm"){ fMarca = t.value; fSerie = serieFrutti[fMarca][0]; render(); }
  if(t.id === "fs"){ fSerie = t.value; render(); }
  if(t.dataset.ks){ kitSel[t.dataset.ks].serie = t.value; render(); }
  if(t.dataset.kcol){ kitSel[t.dataset.kcol].colore = t.value; render(); }
  if(t.dataset.kq){ render(); }
});
view.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id === "cantForm"){
    const nome = document.getElementById("cn").value.trim(); if(!nome) return;
    const anno = new Date().getFullYear(), n = cantieri.filter(c => c.id.startsWith(`C-${anno}-`)).map(c => +c.id.split("-")[2]).reduce((a,b) => Math.max(a,b), 0) + 1;
    const id = `C-${anno}-${String(n).padStart(3,"0")}`;
    cantieri.push({id, nome, tipo:document.getElementById("ct").value.trim() || "Lavoro", serie:document.getElementById("cs").value.trim() || "Da scegliere", mov:[]});
    toast(`Creato cantiere ${id}`); render(); return;
  }
  const m = document.getElementById("nm").value.trim(), c = document.getElementById("nc").value, s = document.getElementById("ns").value.trim();
  if(!m) return;
  if(c === "frut" && s){
    if((serieFrutti[m] ||= []).includes(s)){ toast(`La serie ${m} ${s} c'è già`); return; }
    serieFrutti[m].push(s); aggiungiSerie(m, s, false);
    toast(`Aggiunta serie ${m} ${s} con ${funzioni.length*2-1} articoli`);
  } else {
    art.push({id:serieCod(m)+"."+c.toUpperCase()+"."+art.length,cat:c,marca:m,nome:"Nuovo articolo da completare",um:"pz",qta:0,min:0,gross:grossOf(m)});
    toast(`Aggiunta marca ${m} in ${CAT[c]}`);
  }
  render();
});
view.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.cat !== undefined){ catF = b.dataset.cat; filtro = ""; marcaF = ""; render(); return; }
  if(b.dataset.kit){
    const i = +b.dataset.kit, k = kits[i], s = kitSel[i], n = s.n;
    const c = cantieri.find(x => x.id === document.getElementById("kc").value);
    const righe = k.items.map(([r,q]) => [r.startsWith("fn:") ? frutto(s.serie,s.colore,r.slice(3)) : by(r), q*n]);
    const manca = righe.find(([a,q]) => a.qta < q);
    if(manca){ toast(`Non basta: ${full(manca[0])}. Ordinalo o scegli un'altra serie.`); return; }
    righe.forEach(([a,q]) => { a.qta -= q; c.mov.push([oggi(),a.id,q]); });
    toast(`Scaricato ${n}× "${k.nome}" su ${c.id}`); render();
  }
  if(b.dataset.ric){
    const f = furgoni[b.dataset.ric]; let pezzi = 0;
    Object.entries(standardFurgone).forEach(([id,std]) => { const need = std-(f.items[id]||0), take = Math.min(need, by(id).qta); if(take>0){ by(id).qta -= take; f.items[id] = (f.items[id]||0)+take; pezzi++; }});
    toast(`${f.nome}: ricaricati ${pezzi} articoli`); render();
  }
  if(b.dataset.copy){
    const txt = daOrdinare().filter(a => a.gross === b.dataset.copy).map(a => `${a.id}  ${full(a)}  ${a.min*2-a.qta} ${a.um}`).join("\n");
    navigator.clipboard?.writeText(txt).then(() => toast("Ordine copiato, incollalo nella mail al grossista"), () => toast("Copia non riuscita, seleziona la tabella a mano"));
  }
  if(b.id === "sgo"){
    const a = by(document.getElementById("sa").value), t = document.getElementById("st").value, q = Math.max(1, +document.getElementById("sq").value || 1);
    if(t === "scarico"){ if(a.qta < q){ toast("Quantità non disponibile in sede"); return; } a.qta -= q; cantieri.find(c => c.id === document.getElementById("sc").value).mov.push([oggi(),a.id,q]); }
    else a.qta += q;
    toast(`${t === "scarico" ? "Scaricati" : "Caricati"} ${fmt(q,a.um)} di ${full(a)}`); render();
  }
});
render();
</script>
</body>
</html>
