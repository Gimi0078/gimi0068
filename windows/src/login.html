<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magazzino Elettrico · Accesso</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login">
  <form class="panel" id="f" autocomplete="off">
    <div class="brand">Magazzino Elettrico<small>Versione beta · Accesso</small></div>
    <div><label for="u">Account</label>
      <select id="u" style="width:100%"><option value="magazziniere">Magazziniere</option><option value="sviluppatore">Sviluppatore</option></select></div>
    <div><label for="p">Password</label><input id="p" type="password" required autofocus></div>
    <div id="nuova" hidden style="display:grid;gap:12px">
      <p class="sub">Primo accesso: scegli una nuova password di almeno 8 caratteri.</p>
      <div><label for="n1">Nuova password</label><input id="n1" type="password" minlength="8"></div>
      <div><label for="n2">Ripeti la nuova password</label><input id="n2" type="password" minlength="8"></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" type="submit" id="go">Entra</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
let cambio = false;
$("nuova").hidden = true; $("nuova").style.display = "none";
function mostraCambio(){
  cambio = true; $("nuova").hidden = false; $("nuova").style.display = "grid";
  $("go").textContent = "Salva password ed entra"; $("n1").required = $("n2").required = true; $("n1").focus();
}
$("u").addEventListener("change", () => { if(cambio){ cambio = false; $("nuova").hidden = true; $("nuova").style.display = "none"; $("go").textContent = "Entra"; $("n1").required = $("n2").required = false; } $("err").textContent = ""; });
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const u = $("u").value, p = $("p").value;
  $("err").textContent = "";
  if(cambio){
    if($("n1").value !== $("n2").value){ $("err").textContent = "Le due password nuove non coincidono."; return; }
    const r = await window.magazzino.cambiaPassword(u, p, $("n1").value);
    if(!r.ok){ $("err").textContent = r.errore; return; }
    await window.magazzino.login(u, $("n1").value);
    return;
  }
  const r = await window.magazzino.login(u, p);
  if(r.cambiaPassword) mostraCambio();
  else if(!r.ok){ $("err").textContent = "Password errata."; $("p").select(); }
});
</script>
</body>
</html>
